spring:
  application:
    name: siakad-be

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/siakad}
    username: ${DB_USERNAME:siakad}
    password: ${DB_PASSWORD:siakad}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Skema dikelola sepenuhnya oleh Flyway
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always