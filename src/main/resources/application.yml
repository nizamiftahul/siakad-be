spring:
  application:
    name: siakad-be

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/siakad}
    username: ${DB_USERNAME:siakad}
    password: ${DB_PASSWORD:siakad}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Skema dikelola sepenuhnya oleh Flyway
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework   # percayai X-Forwarded-Proto dari reverse proxy agar URL (termasuk Swagger) memakai https

app:
  jwt:
    # Wajib diganti pada production dengan base64 >= 32 bytes (HS256) via env JWT_SECRET.
    # Default di bawah valid-base64 agar aplikasi bisa boot di development.
    secret: ${JWT_SECRET:c2lha2FkLWRldi1qd3Qtc2lnbmluZy1rZXkhMDEyMzQ1Njc4OWFiY2RlZmdoaWpr}
    access-token-expiration-ms: 900000      # 15 menit
    refresh-token-expiration-ms: 604800000  # 7 hari

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always